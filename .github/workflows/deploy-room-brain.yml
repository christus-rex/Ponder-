name: Deploy Ponder+ Room Brain Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ponder-plus-production-room-brain
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROOM_BRAIN_AUTH_SECRET: ${{ secrets.ROOM_BRAIN_AUTH_SECRET }}
      MEDIA_SESSION_AUTH_SECRET: ${{ secrets.MEDIA_SESSION_AUTH_SECRET }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate Room Brain production bindings
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ROOM_BRAIN_AUTH_SECRET MEDIA_SESSION_AUTH_SECRET; do
            [[ -z "${!name:-}" ]] && missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error title=Room Brain deployment blocked::Missing required configuration: %s\n' "${missing[*]}"
            exit 1
          fi
          if [[ "${#ROOM_BRAIN_AUTH_SECRET}" -lt 32 || "${#MEDIA_SESSION_AUTH_SECRET}" -lt 32 ]]; then
            echo "::error title=Room Brain deployment blocked::Room Brain and media-session secrets must each be at least 32 characters."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify Room Brain contracts
        run: |
          npm run typecheck:domain
          npm run typecheck:room-brain-worker
          npm run test:domain

      - name: Install Wrangler without changing lockfile
        run: npm install --no-save --package-lock=false wrangler@latest

      - name: Prepare Room Brain secrets
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/ponder-room-brain-secrets.json"
          jq -n             --arg ROOM_BRAIN_AUTH_SECRET "$ROOM_BRAIN_AUTH_SECRET"             --arg MEDIA_SESSION_AUTH_SECRET "$MEDIA_SESSION_AUTH_SECRET"             '{
              ROOM_BRAIN_AUTH_SECRET: $ROOM_BRAIN_AUTH_SECRET,
              MEDIA_SESSION_AUTH_SECRET: $MEDIA_SESSION_AUTH_SECRET
            }' > "$secrets_file"
          chmod 600 "$secrets_file"

      - name: Deploy Room Brain Durable Object Worker
        run: >
          npx wrangler deploy
          --config services/room-brain-worker/wrangler.jsonc
          --secrets-file "$RUNNER_TEMP/ponder-room-brain-secrets.json"
