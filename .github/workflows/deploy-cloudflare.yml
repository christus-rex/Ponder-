name: Deploy Ponder+ Web/API Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ponder-plus-production-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SUPABASE_URL: https://wjqcjlcmgeujndxvtprj.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_T-ItORyhh_ptlqmofZXXgA_mvrx4ZgM
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_ROOM_BRAIN_WS_URL: ${{ vars.NEXT_PUBLIC_ROOM_BRAIN_WS_URL || secrets.NEXT_PUBLIC_ROOM_BRAIN_WS_URL }}
      ROOM_BRAIN_ALLOWED_HOSTS: ${{ vars.ROOM_BRAIN_ALLOWED_HOSTS || secrets.ROOM_BRAIN_ALLOWED_HOSTS }}
      ROOM_BRAIN_AUTH_SECRET: ${{ secrets.ROOM_BRAIN_AUTH_SECRET }}
      MEDIA_SESSION_AUTH_SECRET: ${{ secrets.MEDIA_SESSION_AUTH_SECRET }}
      MEDIA_RECONCILIATION_SECRET: ${{ secrets.MEDIA_RECONCILIATION_SECRET }}
      REALTIMEKIT_APP_ID: ${{ secrets.REALTIMEKIT_APP_ID }}
      CLOUDFLARE_REALTIME_API_TOKEN: ${{ secrets.CLOUDFLARE_REALTIME_API_TOKEN }}
      REALTIMEKIT_SUBSCRIBE_ONLY_PRESET: ${{ secrets.REALTIMEKIT_SUBSCRIBE_ONLY_PRESET }}
      REALTIMEKIT_PUBLISHER_PRESET: ${{ secrets.REALTIMEKIT_PUBLISHER_PRESET }}
      REALTIMEKIT_API_BASE: ${{ vars.REALTIMEKIT_API_BASE }}
      REALTIMEKIT_ALLOWED_API_HOSTS: ${{ vars.REALTIMEKIT_ALLOWED_API_HOSTS }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate production bindings
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
            SUPABASE_SERVICE_ROLE_KEY
            NEXT_PUBLIC_ROOM_BRAIN_WS_URL
            ROOM_BRAIN_ALLOWED_HOSTS
            ROOM_BRAIN_AUTH_SECRET
            MEDIA_SESSION_AUTH_SECRET
            MEDIA_RECONCILIATION_SECRET
            REALTIMEKIT_APP_ID
            CLOUDFLARE_REALTIME_API_TOKEN
            REALTIMEKIT_SUBSCRIBE_ONLY_PRESET
            REALTIMEKIT_PUBLISHER_PRESET
            OPENAI_API_KEY
          )
          missing=()
          for name in "${required[@]}"; do
            [[ -z "${!name:-}" ]] && missing+=("$name")
          done

          if (( ${#missing[@]} > 0 )); then
            printf '::error title=Ponder+ web deployment blocked::Missing required production configuration: %s\n' "${missing[*]}"
            exit 1
          fi

          if [[ "${#ROOM_BRAIN_AUTH_SECRET}" -lt 32 || "${#MEDIA_SESSION_AUTH_SECRET}" -lt 32 || "${#MEDIA_RECONCILIATION_SECRET}" -lt 32 ]]; then
            echo "::error title=Ponder+ web deployment blocked::Room/media/reconciliation secrets must each be at least 32 characters."
            exit 1
          fi

      - name: Install application dependencies
        run: npm ci

      - name: Install Cloudflare deployment tooling without changing lockfile
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare@latest wrangler@latest

      - name: Verify web application
        run: |
          npm run typecheck:web
          npm run test:web

      - name: Build full-stack Worker
        run: npx opennextjs-cloudflare build

      - name: Prepare runtime secret bundle
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$RUNNER_TEMP/ponder-web-secrets.json"
          jq -n             --arg SUPABASE_SERVICE_ROLE_KEY "$SUPABASE_SERVICE_ROLE_KEY"             --arg ROOM_BRAIN_AUTH_SECRET "$ROOM_BRAIN_AUTH_SECRET"             --arg MEDIA_SESSION_AUTH_SECRET "$MEDIA_SESSION_AUTH_SECRET"             --arg MEDIA_RECONCILIATION_SECRET "$MEDIA_RECONCILIATION_SECRET"             --arg REALTIMEKIT_APP_ID "$REALTIMEKIT_APP_ID"             --arg CLOUDFLARE_REALTIME_API_TOKEN "$CLOUDFLARE_REALTIME_API_TOKEN"             --arg REALTIMEKIT_SUBSCRIBE_ONLY_PRESET "$REALTIMEKIT_SUBSCRIBE_ONLY_PRESET"             --arg REALTIMEKIT_PUBLISHER_PRESET "$REALTIMEKIT_PUBLISHER_PRESET"             --arg OPENAI_API_KEY "$OPENAI_API_KEY"             '{
              SUPABASE_SERVICE_ROLE_KEY: $SUPABASE_SERVICE_ROLE_KEY,
              ROOM_BRAIN_AUTH_SECRET: $ROOM_BRAIN_AUTH_SECRET,
              MEDIA_SESSION_AUTH_SECRET: $MEDIA_SESSION_AUTH_SECRET,
              MEDIA_RECONCILIATION_SECRET: $MEDIA_RECONCILIATION_SECRET,
              REALTIMEKIT_APP_ID: $REALTIMEKIT_APP_ID,
              CLOUDFLARE_REALTIME_API_TOKEN: $CLOUDFLARE_REALTIME_API_TOKEN,
              REALTIMEKIT_SUBSCRIBE_ONLY_PRESET: $REALTIMEKIT_SUBSCRIBE_ONLY_PRESET,
              REALTIMEKIT_PUBLISHER_PRESET: $REALTIMEKIT_PUBLISHER_PRESET,
              OPENAI_API_KEY: $OPENAI_API_KEY
            }' > "$secrets_file"
          chmod 600 "$secrets_file"

      - name: Deploy authenticated Ponder+ Worker
        shell: bash
        run: |
          set -euo pipefail
          args=(
            deploy
            --secrets-file "$RUNNER_TEMP/ponder-web-secrets.json"
            --var "NEXT_PUBLIC_SUPABASE_URL:$NEXT_PUBLIC_SUPABASE_URL"
            --var "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
            --var "CLOUDFLARE_ACCOUNT_ID:$CLOUDFLARE_ACCOUNT_ID"
            --var "NEXT_PUBLIC_ROOM_BRAIN_WS_URL:$NEXT_PUBLIC_ROOM_BRAIN_WS_URL"
            --var "ROOM_BRAIN_ALLOWED_HOSTS:$ROOM_BRAIN_ALLOWED_HOSTS"
          )
          if [[ -n "${REALTIMEKIT_API_BASE:-}" ]]; then
            args+=(--var "REALTIMEKIT_API_BASE:$REALTIMEKIT_API_BASE")
          fi
          if [[ -n "${REALTIMEKIT_ALLOWED_API_HOSTS:-}" ]]; then
            args+=(--var "REALTIMEKIT_ALLOWED_API_HOSTS:$REALTIMEKIT_ALLOWED_API_HOSTS")
          fi
          npx wrangler "${args[@]}"
