name: Deploy Full Ponder+ App (approved one-shot)

on:
  push:
    branches: ["deploy/approved-20260831-0140"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ponder-plus-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Check production configuration
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: https://wjqcjlcmgeujndxvtprj.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_T-ItORyhh_ptlqmofZXXgA_mvrx4ZgM
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]] && missing+=("CLOUDFLARE_API_TOKEN")
          [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]] && missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -z "${NEXT_PUBLIC_SUPABASE_URL:-}" ]] && missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [[ -z "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}" ]] && missing+=("NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY")

          if (( ${#missing[@]} > 0 )); then
            {
              echo "## Ponder+ production deployment blocked"
              echo
              echo "Missing required GitHub Actions secrets/variables:"
              printf -- "- %s\n" "${missing[@]}"
              echo
              echo "The deployment was not attempted. No secret values were printed."
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error title=Ponder+ deployment blocked::Missing required production configuration: ${missing[*]}"
            exit 1
          fi

          echo "Production configuration is present." >> "$GITHUB_STEP_SUMMARY"

      - name: Install application dependencies
        run: npm ci

      - name: Install Cloudflare adapter without changing lockfile
        run: npm install --no-save --package-lock=false @opennextjs/cloudflare@latest wrangler@latest

      - name: Generate Cloudflare runtime configuration
        shell: bash
        run: |
          cat > open-next.config.ts <<'CONFIG'
          import { defineCloudflareConfig } from "@opennextjs/cloudflare";

          export default defineCloudflareConfig();
          CONFIG

          cat > wrangler.jsonc <<'CONFIG'
          {
            "$schema": "./node_modules/wrangler/config-schema.json",
            "name": "ponder-plus",
            "main": ".open-next/worker.js",
            "compatibility_date": "2026-08-30",
            "compatibility_flags": ["nodejs_compat"],
            "assets": {
              "directory": ".open-next/assets",
              "binding": "ASSETS"
            },
            "observability": {
              "enabled": true
            }
          }
          CONFIG

      - name: Verify web application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wjqcjlcmgeujndxvtprj.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_T-ItORyhh_ptlqmofZXXgA_mvrx4ZgM
          NEXT_PUBLIC_ROOM_BRAIN_WS_URL: ${{ vars.NEXT_PUBLIC_ROOM_BRAIN_WS_URL || secrets.NEXT_PUBLIC_ROOM_BRAIN_WS_URL }}
          ROOM_BRAIN_AUTH_SECRET: ${{ secrets.ROOM_BRAIN_AUTH_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm run typecheck:web
          npm run test:web

      - name: Build full-stack Worker
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://wjqcjlcmgeujndxvtprj.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_T-ItORyhh_ptlqmofZXXgA_mvrx4ZgM
          NEXT_PUBLIC_ROOM_BRAIN_WS_URL: ${{ vars.NEXT_PUBLIC_ROOM_BRAIN_WS_URL || secrets.NEXT_PUBLIC_ROOM_BRAIN_WS_URL }}
          ROOM_BRAIN_AUTH_SECRET: ${{ secrets.ROOM_BRAIN_AUTH_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx opennextjs-cloudflare build

      - name: Deploy authenticated Ponder+ to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: https://wjqcjlcmgeujndxvtprj.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_T-ItORyhh_ptlqmofZXXgA_mvrx4ZgM
          NEXT_PUBLIC_ROOM_BRAIN_WS_URL: ${{ vars.NEXT_PUBLIC_ROOM_BRAIN_WS_URL || secrets.NEXT_PUBLIC_ROOM_BRAIN_WS_URL }}
          ROOM_BRAIN_AUTH_SECRET: ${{ secrets.ROOM_BRAIN_AUTH_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx wrangler deploy
