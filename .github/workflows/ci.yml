name: CI

on:
  push:
    branches: [main, "integration/**"]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - name: Commit integrated lockfile
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integration/')
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock integrated dependency graph"
          git push origin HEAD:${GITHUB_REF_NAME}
      - run: npm run audit:ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
